# setup.cfg — Project-level tool configuration for pytest and flake8
# ─────────────────────────────────────────────────────────────────

[tool:pytest]
# ── Test discovery ──────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ──────────────────────────────────────────────────────────────────
# -v   = verbose (show each test name)
# --tb=short  = short traceback format on failures
addopts = -v --tb=short

# ── Markers ─────────────────────────────────────────────────────────────────
# Run with:  pytest -m unit   or   pytest -m integration
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (require MySQL, etc.)
    slow: Tests that take more than 5 seconds

[flake8]
max-line-length = 100

# Virtual environments are excluded by name. Python's venv writes its own
# .gitignore, but flake8 does not read .gitignore, so an environment created
# inside the project (e.g. datatrust-venv/) would otherwise be linted.
exclude =
    .venv,
    venv,
    *-venv,
    datatrust-venv,
    __pycache__,
    .git,
    build,
    dist

# E402 is silenced ONLY for entry points that must extend sys.path before
# importing src.*, which is deliberate and verified in each file listed here.
# It is never ignored globally.
per-file-ignores =
    run_*.py:E402
    dags/datatrust_pipeline.py:E402
    dashboard/app.py:E402
    scripts/init_db.py:E402
    tests/unit/test_profiler.py:E402
    tests/unit/scripts/init_db.py:E402
